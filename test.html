<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <!-- Typography CSS -->
    <link rel="stylesheet" href="typography.css">

    <!-- Style CSS -->
    <!-- <link rel="stylesheet" href="style.css"> -->

    <link rel="stylesheet" href="test.css">

    <link rel="stylesheet" href="buttons.css">
</head>

<body>

    <header class="navigation-bar">
        <div class="navi-logo">
            <img src="Images/logowithtext.png" width="100" alt="Logo">
        </div>
    
        <nav class="navi-links">
            <a href="#">Products</a>
            <a href="#">Services</a>
            <a href="#">Hair Designer</a>
            <a href="#">Gallery</a>
            <a href="#">Contact Us</a>
        </nav>
    
        <div class="navi-call-btn">
            <a href="#">Call Now</a>
        </div>
    
        <!-- Hamburger Menu -->
        <div class="hamburger" onclick="toggleMenu()">
            ☰
        </div>
    
        <!-- Floating Icons -->
        <img class="floating-icon f1" src="Images/floral-design6.png" alt="">
        <img class="floating-icon f2" src="Images/floral-design3.png" alt="">
    </header>
    

    <div class="container hero">
        <img class="floating-icon laxmiji" src="Images/Laxmi-maa-illustration.png" alt="Laxmiji">
        <img class="floating-icon f3" src="Images/FullFlowerIcon5.png" alt="Flower5">
        <img class="floating-icon f4" src="Images/FullFlowerIcon5.png" alt="Flower5">

        <div class="row hero-element">
            <div class="col-md-6 text-side p-0">
                <h2 class="light-txt-clr">
                    Your <span class="highlight-txt">Beauty, </span>
                    Your <span class="highlight-txt">Serenity, </span>
                    Your <span class="highlight-txt">Shanti</span>
                </h2>
                <p>
                    Shanti Salon is more than just a beauty space—it’s an experience of self-care, transformation, and
                    tranquility.
                </p>
                <div class="btn-groups">
                    <a class="dark" href="#">Call Now</a>
                    <a class="" href="#">Book Now</a>
                </div>
            </div>
            <div class="col-md-6 img-side">
                <img class="floating-icon halo" src="Images/Royalhalo.png" alt="Halo">
                <!-- <img class="static-img" src="Images/hairdresser.png" width="600" alt="Women with Long Hair"> -->
            </div>
            
        </div>
    </div>

    <script>
        function toggleMenu() {
    document.querySelector('.navi-links').classList.toggle('active');
}

    </script>
</body>

</html>
