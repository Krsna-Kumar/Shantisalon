<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="Images/ssicon.png">
    <title>Shanti Salon - Unofficial Website</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <link rel="stylesheet" href="loader.css">

    <!-- Typography CSS -->
    <link rel="stylesheet" href="typography.css">

    <!-- Style CSS -->
    <!-- <link rel="stylesheet" href="style.css"> -->
    <link rel="stylesheet" href="test.css">

    <!-- Buttons CSS -->
    <link rel="stylesheet" href="buttons.css">

    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css" rel="stylesheet">
</head>

<body>
    <!-- Loader -->
    <div class="loader">
        <img src="Images/Loader.png" alt="Loading...">
    </div>


    <div class="navigation-bar">
        <div class="navi-logo">
            <img src="Images/logowithtext.png" width="100" alt="">
        </div>
        <div class="navi-links">
            <a href="#">Products</a>
            <a href="#">Services</a>
            <a href="#">Hair Designer</a>
            <a href="#">Gallery</a>
            <a href="#">Contact Us</a>

            <img class="floating-icon toggle-f1" src="Images/floral-design1.png" alt="">

        </div>
        <div class="navi-call-btn">
            <a href="#">Call Now</a>
        </div>

        <img class="floating-icon f1" src="Images/floral-design6.png" alt="">
        <img class="floating-icon f2" src="Images/floral-design3.png" alt="">
        <div class="hamburger" onclick="toggleMenu()">
            <i class="ri-menu-3-fill"></i>
        </div>
    </div>

    <div class="hero-wrapper">
        <div class="container hero">
            <img class="floating-icon laxmiji" src="Images/Laxmi-maa-illustration1.png" alt="Laxmiji">
            <img class="floating-icon f3" src="Images/FullFlowerIcon5.png" alt="Flower5">
            <img class="floating-icon f4" src="Images/FullFlowerIcon5.png" alt="Flower5">
            <img class="floating-icon f5" src="Images/blue-halof.png" alt="Flower5">

            <div class="row hero-element">
                <div class="col-md-6 text-side p-md-0">
                    <h2 class="light-txt-clr">
                        Your <span class="highlight-txt">Beauty, </span>
                        Your <span class="highlight-txt">Serenity, </span>
                        Your <span class="highlight-txt">Shanti</span>
                    </h2>
                    <p>
                        Shanti Salon is more than just a beauty space—it’s an experience of self-care, transformation,
                        and
                        tranquility.
                    </p>
                    <div class="btn-group">
                        <a class="darker-btn" href="#">Call Now</a>
                        <a class="secondary-btn" href="#">Book Now</a>
                    </div>
                </div>
                <div class="col-md-6 img-side">
                    <img class="floating-icon halo" src="Images/Royalhalo.png" alt="Halo">
                    <img class="static-img filter-stroke" src="Images/1740139840602.png" width="550"
                        alt="Women with Long Hair">
                    <!-- <img class="static-img filter-stroke" src="Images/women-relaxing.png" width="850" alt="Women with Long Hair"> -->
                </div>

            </div>
        </div>
    </div>

    <script>
        window.addEventListener("load", function () {
            setTimeout(function () {
                document.querySelector('.loader').classList.add('hidden');
            }, 1000); // Loader stays for at least 1 second before fading out
        });

        function toggleMenu() {
            const navbar = document.querySelector('.navigation-bar');
            const navLinks = document.querySelector('.navi-links');
            navLinks.classList.toggle('active');

            if (navLinks.classList.contains('active')) {
                document.body.appendChild(navLinks);

            } else {
            }

        }

    </script>
</body>

</html>
